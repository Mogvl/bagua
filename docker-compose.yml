# ============================================================
# 命语（mingyu）· 绿联 NAS（UGOS Pro）Docker Compose
# ------------------------------------------------------------
# 零配置即可用：默认宿主机端口 9801、AI 解读关闭。
# 无需任何编辑，直接执行：
#   docker compose up -d --build
#
# 自定义配置（可选）：复制 .env.example 为 .env 后修改，
# 或直接运行一键脚本：bash setup.sh
#
# 常用命令：
#   构建启动： docker compose up -d --build
#   停止：     docker compose down
#   日志：     docker compose logs -f
# ============================================================

services:
  mingyu:
    build:
      context: ./mingyu          # 命语源码目录（本仓库已附带）
      args:
        VITE_ENABLE_DONATION_BOX: ${VITE_ENABLE_DONATION_BOX:-false}
    image: mingyu:latest
    container_name: mingyu
    restart: always               # NAS 重启后自动拉起
    ports:
      - "${UGREEN_PORT:-9801}:3000"   # 宿主机 9801 → 容器内 3000
    environment:
      # ---- AI 解读（可选）。不配置也能正常排盘/起卦 ----
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-DeepSeek}
      # 置为 true 才启用服务端 AI 解读
      AI_BUILTIN_ENABLED: ${AI_BUILTIN_ENABLED:-false}
      AI_DEFAULT_ENABLED: ${AI_DEFAULT_ENABLED:-false}
    # 可选：限制容器资源（绿联 NAS 上避免占满内存）
    # mem_limit: 1g
    # cpus: 2

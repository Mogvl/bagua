# ============================================================
# 命语（mingyu）· 绿联 NAS 一键部署（镜像方式）
# ------------------------------------------------------------
# 用法：把本文件内容粘贴到绿联 Docker「项目」中即可一键部署，
#       或在有 docker 的机器上：docker compose up -d
#
# 镜像由 CI 自动构建发布：ghcr.io/mogvl/bagua:latest
# 部署完成后浏览器访问：http://NAS的IP:9801
# ============================================================

services:
  mingyu:
    image: ghcr.io/mogvl/bagua:latest
    container_name: mingyu
    restart: unless-stopped
    environment:
      # 容器内监听端口（与下方端口映射保持一致）
      PORT: 9801
      # ---- AI 解读（可选）。留空则关闭；填写 DeepSeek Key 并置
      #      AI_BUILTIN_ENABLED=true 后生效 ----
      AI_API_KEY: ""
      AI_BASE_URL: https://api.deepseek.com/v1
      AI_MODEL: deepseek-chat
      AI_PROVIDER_NAME: DeepSeek
      AI_BUILTIN_ENABLED: "false"
      AI_DEFAULT_ENABLED: "false"
    ports:
      - "9801:9801"
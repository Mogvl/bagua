# ============================================================
# CI：push 到 main 时自动验证 + 发布 Docker 镜像
#   job 1: build  —— Node 前端构建检查（pnpm build）
#   job 2: docker —— 构建并推送镜像到 ghcr.io/mogvl/bagua:latest
#                    （绿联 NAS 上 docker compose up -d 直接拉取）
#   PR 触发时仅验证，不推送镜像
# ============================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: pnpm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build

  docker:
    name: docker image (ghcr.io/mogvl/bagua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mingyu
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/mogvl/bagua:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max